<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaivo - AI-Powered Adaptive Learning</title>
  <meta name="description" content="Klaivo builds your personalized learning path, node by node, powered by AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Perplexity-Style Left Navigation Sidebar (200px) -->
    <nav class="app-left-nav" id="app-left-nav">
      <!-- Top Brand Logo & Toggle Button -->
      <div class="nav-logo-section">
        <div class="logo-left-cluster">
          <div class="logo-icon-wrapper">
            <span class="logo-mark">K</span>
          </div>
          <div class="logo-text-wrapper">
            <span class="logo-title">Klaivo</span>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle Navigation Sidebar" aria-label="Toggle Navigation Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>

      <!-- New Session Button (Perplexity Style: + New ^I) -->
      <button class="nav-new-session-btn" id="nav-new-session-btn" title="Start a New Learning Session" aria-label="Start a New Learning Session">
        <div class="nav-new-btn-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New</span>
        </div>
        <span class="nav-shortcut-badge">^I</span>
      </button>

      <!-- Scrollable Navigation Sections -->
      <div class="nav-scroll-area">
        <!-- Session Section (Sentence Case: Session) -->
        <div class="nav-section" id="nav-sessions-group">
          <div class="nav-section-header" id="nav-sessions-header" title="Session">
            <div class="nav-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
              <span>Session</span>
            </div>
          </div>
          <div class="nav-section-body" id="nav-sessions-list">
            <!-- Dynamic session items (overall titles without icons) -->
          </div>
        </div>

        <!-- History Section (Sentence Case: History) -->
        <div class="nav-section" id="nav-history-group">
          <div class="nav-section-header" id="nav-history-header" title="History">
            <div class="nav-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>
              <span>History</span>
            </div>
          </div>
          <div class="nav-section-body" id="nav-history-list">
            <!-- Dynamic history items (without icons) -->
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Workspace Container -->
    <div class="main-content-wrapper">
      <!-- Main App Header -->
      <header class="app-header">
        <div class="header-right-cluster">
          <button class="header-split-toggle-btn active" id="header-split-toggle-btn" title="Toggle Canvas Split View" aria-label="Toggle Canvas Split View">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4V3z" fill="currentColor" opacity="0.3"/>
            </svg>
          </button>
        </div>
      </header>

    <div class="screen-wrapper">

      <!-- ═══════════════════════════════════════════ -->
      <!-- STAGE 1: Welcome / Hero Screen              -->
      <!-- ═══════════════════════════════════════════ -->
      <section class="screen" id="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-hero">
            <h1 class="welcome-title" id="welcome-greeting-title">Good afternoon</h1>
          </div>

          <div class="welcome-input-card">
            <!-- Uploaded file chips appear here -->
            <div class="uploaded-files-list" id="welcome-files-list"></div>

            <div class="welcome-textarea-container">
              <textarea
                id="welcome-input"
                class="welcome-input auto-expand-textarea"
                placeholder="Describe your learning goal, topic, or exam syllabus..."
                rows="2"
                autocomplete="off"
                aria-label="Describe your learning goal, topic, or exam syllabus"
              ></textarea>
            </div>

            <!-- Integrated Composer Toolbar -->
            <div class="welcome-composer-toolbar">
              <div class="toolbar-left-cluster">
                <button type="button" class="welcome-attach-icon-btn" id="welcome-attach-btn" title="Attach notes or syllabus file (PDF/Text)" aria-label="Attach notes or syllabus file">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <input type="file" id="welcome-file-input" accept=".pdf,.txt" multiple style="display:none;">
              </div>

              <div class="toolbar-right-cluster">
                <button class="welcome-send-btn" id="welcome-send-btn" title="Start Learning Session" aria-label="Start Learning Session">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Quick learning suggestions (pushed close under input card) -->
          <div class="welcome-suggestions">
            <button class="suggestion-chip" data-prompt="Prepare me for WAEC Chemistry — Organic Chemistry section" aria-label="WAEC Chemistry topic">🧪 WAEC Chemistry</button>
            <button class="suggestion-chip" data-prompt="Help me understand Calculus — differentiation and integration" aria-label="Calculus topic">∫ Calculus</button>
            <button class="suggestion-chip" data-prompt="I want to pass my AWS Solutions Architect exam" aria-label="AWS Exam Prep">☁️ AWS Exam Prep</button>
            <button class="suggestion-chip" data-prompt="Teach me Python programming from scratch" aria-label="Python Basics">🐍 Python Basics</button>
          </div>
        </div>
      </section>

      <!-- ═══════════════════════════════════════════════════════════ -->
      <!-- STAGE 2 + 3: Discovery Chat → Split Workspace              -->
      <!-- ═══════════════════════════════════════════════════════════ -->
      <section class="screen hidden" id="workspace-screen">

        <!-- Sidebar Chat panel (Left side — Column 1: AI Text Area) -->
        <aside class="chat-sidebar" id="chat-sidebar">
          <div class="sidebar-header">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <h3 id="sidebar-node-title" class="sidebar-node-title-el">Learning Session</h3>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button class="file-upload-btn" id="exit-node-btn" style="display: none; padding: 6px 12px;" aria-label="Back to Overview Path">
                Back to Overview
              </button>
            </div>
          </div>
          
          <!-- Chat messages stream with WCAG aria-live -->
          <div class="chat-history" id="chat-history" aria-live="polite" role="log" aria-label="Tutor Explanation Stream">
            <!-- Messages dynamic content -->
          </div>
          
          <!-- Chat input bar -->
          <div class="sidebar-input-area">
            <div class="uploaded-files-list" id="onboarding-files-list"></div>
            <div class="input-box-wrapper">
              <label class="attachment-btn" title="Upload Syllabus / Notes (PDF/Text)" aria-label="Attach notes file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                <input type="file" id="onboarding-file-input" accept=".pdf,.txt" multiple style="display: none;">
              </label>
              <textarea id="chat-input" class="auto-expand-textarea" placeholder="Type your response or question..." rows="1" aria-label="Response input"></textarea>
              <button class="sidebar-send-btn" id="send-chat-btn" aria-label="Send response">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </aside>

        <!-- Resizer Handle (Cursor & Antigravity IDE Gutter Lock) -->
        <div class="panel-resizer" id="panel-resizer" title="Drag to resize | Double-click to reset width" role="separator" aria-orientation="vertical"></div>

        <!-- Canvas panel (Right side — Column 2: Canvas) -->
        <main class="canvas-panel" id="canvas-panel" aria-label="Interactive Knowledge Graph Workspace">
          <!-- Zoom & Pan & Panel Action Controls (WCAG 44px Touch Targets) -->
          <div class="canvas-controls">
            <button class="canvas-btn canvas-fullscreen-btn" id="canvas-fullscreen-btn" title="Expand Canvas Fullscreen" aria-label="Expand Canvas Fullscreen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </button>
            <button class="canvas-btn" id="zoom-in-btn" title="Zoom In" aria-label="Zoom In">+</button>
            <button class="canvas-btn" id="zoom-out-btn" title="Zoom Out" aria-label="Zoom Out">-</button>
            <button class="canvas-btn" id="zoom-reset-btn" title="Reset View" aria-label="Reset Zoom and Centering View">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>
          </div>
          
          <!-- Zoomable, Pannable Concept Tree SVG -->
          <svg id="concept-svg" viewBox="0 0 1000 800">
            <defs>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
              <linearGradient id="indigo-violet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#e5e7eb" />
              </linearGradient>
              <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#34d399" />
              </linearGradient>
            </defs>
            <g id="canvas-viewport">
              <g id="svg-edges"></g>
              <g id="svg-nodes"></g>
            </g>
          </svg>
        </main>
      </section>

    </div><!-- /.screen-wrapper -->
    </div><!-- /.main-content-wrapper -->

    <!-- Live progress loading overlay (kept for compatibility but rarely used) -->
    <div class="progress-overlay hidden" id="progress-overlay">
      <div class="spinner"></div>
      <div class="progress-text" id="progress-text">Analyzing your learning intent...</div>
    </div>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
