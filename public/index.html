<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaivo - AI-Powered Adaptive Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Main App Header -->
    <header class="app-header">
      <div class="logo-section">
        <div class="logo-icon">K</div>
        <div class="logo-text">Klaivo</div>
      </div>
      
      <div class="header-status hidden" id="header-status">
        <div class="calibration-badge">
          <span>Calibration:</span>
          <span class="calibration-level" id="header-calibration">Beginner</span>
        </div>
      </div>
    </header>

    <div class="screen-wrapper">
      <!-- Onboarding / Welcome Screen -->
      <section class="screen" id="landing-screen">
        <div class="landing-content">
          <h1 class="landing-title">Think it. <span>Learn it.</span> Prove it.</h1>
          <p class="landing-subtitle">Tell Klaivo what you want to learn, solve, or prepare for. We'll build a personalized path and guide you node by node.</p>
          
          <div class="prompt-container">
            <textarea 
              class="prompt-textarea" 
              id="initial-prompt" 
              placeholder="Describe your learning goal, exam, or project in plain language..."
            ></textarea>
            
            <div class="uploaded-files-list" id="onboarding-files-list"></div>
            
            <div class="prompt-actions">
              <label class="file-upload-btn">
                <span>📎 Upload Syllabus / Past Questions (PDF/Text)</span>
                <input type="file" id="onboarding-file-input" accept=".pdf,.txt" multiple>
              </label>
              
              <button class="send-btn" id="start-session-btn" title="Start Diagnosis">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Learning Workspace Screen (Split Screen) -->
      <section class="screen hidden" id="workspace-screen">
        <!-- Sidebar Chat panel -->
        <aside class="chat-sidebar">
          <div class="sidebar-header">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <h3 id="sidebar-node-title">Curriculum Diagnostic</h3>
              <span class="node-badge" id="sidebar-node-status">Diagnosis</span>
            </div>
            <button class="file-upload-btn" id="exit-node-btn" style="display: none; padding: 4px 8px;">
              Back to Overview
            </button>
          </div>
          
          <!-- Chat messages stream -->
          <div class="chat-history" id="chat-history">
            <!-- Messages dynamic content -->
          </div>
          
          <!-- Chat inputs -->
          <div class="sidebar-input-area">
            <div class="input-box-wrapper">
              <input type="text" id="chat-input" placeholder="Type your response here...">
              <button class="sidebar-send-btn" id="send-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </aside>

        <!-- Canvas panel (Right side) -->
        <main class="canvas-panel">
          <!-- Canvas Overlay Information -->
          <div class="canvas-title-overlay">
            <h4 id="canvas-session-title">Your Learning Path</h4>
            <p id="canvas-session-stats">0 of 0 Nodes Completed</p>
          </div>
          
          <!-- Zoom & Pan Controls -->
          <div class="canvas-controls">
            <button class="canvas-btn" id="zoom-in-btn" title="Zoom In">+</button>
            <button class="canvas-btn" id="zoom-out-btn" title="Zoom Out">-</button>
            <button class="canvas-btn" id="zoom-reset-btn" title="Reset View">⟲</button>
          </div>
          
          <!-- Zoomable, Pannable Concept Tree SVG -->
          <svg id="concept-svg" viewBox="0 0 1000 800">
            <!-- Definitions for glow filters, gradients, markers -->
            <defs>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
              <linearGradient id="indigo-violet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
              <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#34d399" />
              </linearGradient>
            </defs>
            
            <!-- Root transformation group for panning/zooming -->
            <g id="canvas-viewport">
              <!-- Edge connections group -->
              <g id="svg-edges"></g>
              <!-- Nodes group -->
              <g id="svg-nodes"></g>
            </g>
          </svg>
        </main>
      </section>
    </div>

    <!-- Live progress loading overlay -->
    <div class="progress-overlay hidden" id="progress-overlay">
      <div class="spinner"></div>
      <div class="progress-text" id="progress-text">Analyzing your learning intent...</div>
    </div>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
